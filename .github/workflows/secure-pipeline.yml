name: secure-pipeline

# Full gated pipeline against OWASP Juice Shop. Runs on GitHub, or locally via:
#   act pull_request -W .github/workflows/secure-pipeline.yml --container-architecture linux/amd64

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  issues: write

env:
  JUICE_IMAGE: bkimminich/juice-shop:latest

jobs:
  # ---- STAGE 1 · STATIC (source + image on disk, no app running) ----
  secrets:
    name: Stage 1 · Secrets scan (TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - run: git clone --depth 1 https://github.com/juice-shop/juice-shop.git src
      - uses: trufflesecurity/trufflehog@main
        with: { path: src, extra_args: --results=verified,unknown }

  sast:
    name: Stage 1 · SAST + AI triage (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git clone --depth 1 https://github.com/juice-shop/juice-shop.git src
      - uses: returntocorp/semgrep-action@v1
        with: { config: "p/javascript p/typescript semgrep/rules.yml", generateSarif: "1" }
      - uses: github/codeql-action/upload-sarif@v3
        with: { sarif_file: semgrep.sarif }

  supply-chain:
    name: Stage 1 · Container scan + SBOM (Trivy)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: CycloneDX SBOM (CRA evidence)
        uses: aquasecurity/trivy-action@master
        with: { image-ref: '${{ env.JUICE_IMAGE }}', format: cyclonedx, output: sbom.json }
        # 💡 MOVE 2: Upload immediately so it is saved before any job fails
      - uses: actions/upload-artifact@v4
        with: { name: sbom-artifact, path: sbom.json, retention-days: 90 }
        # 💡 MOVE 3: Run gate check last
      - name: Trivy gate
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.JUICE_IMAGE }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

  # ---- STAGE 2 · DYNAMIC (attack the live app; runs only after Stage 1 passes) ----
  e2e:
    name: Stage 2 · Playwright exploit proofs
    runs-on: ubuntu-latest
    needs: [secrets, sast, supply-chain]
    services:
      juice: { image: bkimminich/juice-shop:latest, ports: ['3000:3000'] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci && npx playwright install --with-deps chromium
      - run: npx wait-on http://localhost:3000
      - run: npx playwright test

      - name: Upload Exploit Screenshots & Evidence
        uses: actions/upload-artifact@v4
        if: always() # Forces this step to execute even if the tests fail
        with:
          name: playwright-exploit-evidence
          path: |
            out/playwright/
            playwright-report/
            retention-days: 14

  dast:
      name: Stage 2 · Nuclei + ZAP DAST
      runs-on: ubuntu-latest
      needs: [e2e]
      services:
        juice: { image: bkimminich/juice-shop:latest, ports: ['3000:3000'] }
      steps:
        - uses: actions/checkout@v4

        - run: npx wait-on http://localhost:3000

        # 1. Nuclei DAST Scan Step
        - uses: projectdiscovery/nuclei-action@v3
          with: { target: 'http://localhost:3000', templates: nuclei-templates/ }

        # 2. FIX: Grant global container write privileges to prevent ZAP's [Errno 13] permission crash
        - name: Fix Workspace Permissions for ZAP
          run: chmod -R 777 ${{ github.workspace }}

        # 3. FIX: Execute ZAP scan without creating GitHub issue tickets
        - name: ZAP baseline (passive)
          uses: zaproxy/action-baseline@v0.13.0 # Updated to the latest stable action release version
          with:
            target: 'http://localhost:3000'
            token: ${{ secrets.GITHUB_TOKEN }}
            fail_action: false
            issue_title: 'Security Scan Alert - Vulnerability Detected'
            # This tells ZAP to store results in the repository instead of opening issues
            allow_issue_writing: false
            cmd_options: '-I'

        - name: Upload ZAP Scan Artifacts Safely
          if: always() # Ensures logs upload even if the scan highlights vulnerabilities
          uses: actions/upload-artifact@v4
          with:
            name: zap_scan
            # ZAP defaults to creating 'report.html' in the working directory
            path: |
              report.html
              zap_report.html    


  gate:
    name: Release gate
    runs-on: ubuntu-latest
    needs: [secrets, sast, supply-chain, e2e, dast]
    steps:
      - run: |
          echo "All gates evaluated. Artefacts retained: SARIF, SBOM, Playwright report, Nuclei report."
